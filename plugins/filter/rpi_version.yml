---
DOCUMENTATION:
  name: rpi_version
  version_added: "1.0.1"
  short_description: return the upstream triple from a Raspberry Pi kernel
  description:
    - Return C(major.minor.patch) from O(_input).
    - Return an empty string when the release has no upstream version.
  author:
    - mrjoshuap
  notes:
    - This filter runs on the controller.
    - C(uname -r) on Raspberry Pi OS looks like C(6.18.50+rpt-rpi-v8) or C(6.1.21-v8+).
  positional: _input
  options:
    _input:
      description: Running kernel release.
      type: str
      required: true

EXAMPLES: |
  {{ "6.18.50+rpt-rpi-v8" | mrjoshuap.ezcve.rpi_version }}

RETURN:
  _value:
    description: Upstream triple, such as V(6.18.50).
    type: str
