---
extends: default

# Installed collections live under .ansible/, which .gitignore already excludes.
ignore-from-file: .gitignore

rules:
  line-length:
    max: 160
    level: warning
  document-start:
    present: true
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: true
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments-indentation: disable
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
