---
DOCUMENTATION:
  name: deb_installed_versions
  version_added: "1.0.0"
  short_description: return versions of installed linux-image packages
  description:
    - Return the C(version) of every installed package whose name starts with C(linux-image-).
  author:
    - mrjoshuap
  notes:
    - This filter runs on the controller.
    - O(_input) is the mapping produced by C(package_facts).
  positional: _input
  options:
    _input:
      description: C(ansible_facts['packages']).
      type: dict
      required: true

EXAMPLES: |
  {{ ansible_facts["packages"] | mrjoshuap.ezcve.deb_installed_versions }}

RETURN:
  _value:
    description: Installed linux-image versions.
    type: list
    elements: str
