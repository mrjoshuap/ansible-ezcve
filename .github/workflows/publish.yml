---
# Publish mrjoshuap.ezcve to Ansible Galaxy and GitHub Releases.
#
# galaxy.yml version: is the next release (X.Y.Z, no v, no prerelease).
# A tag vX.Y.Z on that commit publishes Galaxy version X.Y.Z and a GitHub Release.
# A push to main publishes X.Y.Z-dev.<UTC timestamp> and a GitHub prerelease.
# The stable tag filter uses +, meaning one or more digits. The dev tag
# vX.Y.Z-dev.<timestamp> does not match it. A dev tag that does arrive is skipped.
# Repository secret GALAXY_API_KEY is the token from Galaxy → Preferences.
name: publish

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths:
      - "galaxy.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "roles/**"
      - "plugins/**"
      - "meta/**"
      - "scripts/release_version.py"
      - ".github/workflows/publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "galaxy.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "roles/**"
      - "plugins/**"
      - "meta/**"
      - "scripts/release_version.py"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate collection build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release version rules
        run: python3 scripts/release_version.py --self-test

      - name: Check galaxy.yml version is the next release
        run: python3 scripts/release_version.py --ref refs/heads/main --timestamp 20261103142922 >/dev/null

      - name: Install ansible-core
        run: |
          python3 -m venv "${RUNNER_TEMP:-/tmp}/ansible-galaxy-venv"
          "${RUNNER_TEMP:-/tmp}/ansible-galaxy-venv/bin/pip" install --upgrade pip
          "${RUNNER_TEMP:-/tmp}/ansible-galaxy-venv/bin/pip" install "ansible-core>=2.16.0"
          echo "${RUNNER_TEMP:-/tmp}/ansible-galaxy-venv/bin" >> "${GITHUB_PATH}"

      - name: Build collection tarball
        run: |
          ansible-galaxy collection build
          ls -la mrjoshuap-ezcve-*.tar.gz

      - name: Verify tarball excludes local install artifacts
        run: |
          ARTIFACT="$(ls mrjoshuap-ezcve-*.tar.gz)"
          if tar -tzf "${ARTIFACT}" | grep -Eq '^\.ansible/|^tests/|^molecule/'; then
            echo "ERROR: ${ARTIFACT} contains files that build_ignore should drop"
            exit 1
          fi

  publish:
    runs-on: ubuntu-latest
    name: Publish Galaxy release
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ansible-core
        run: |
          python3 -m venv "${RUNNER_TEMP:-/tmp}/ansible-galaxy-venv"
          "${RUNNER_TEMP:-/tmp}/ansible-galaxy-venv/bin/pip" install --upgrade pip
          "${RUNNER_TEMP:-/tmp}/ansible-galaxy-venv/bin/pip" install "ansible-core>=2.16.0"
          echo "${RUNNER_TEMP:-/tmp}/ansible-galaxy-venv/bin" >> "${GITHUB_PATH}"

      - name: Decide release version
        id: version
        run: |
          python3 scripts/release_version.py \
            --ref "${GITHUB_REF}" \
            --timestamp "$(date -u +%Y%m%d%H%M%S)" \
            --write \
            --notes "${RUNNER_TEMP}/release-notes.md" \
            --require-stable-floor \
            >> "${GITHUB_OUTPUT}"

      - name: Build collection tarball
        if: steps.version.outputs.channel != 'skip'
        run: |
          set -euo pipefail
          ansible-galaxy collection build
          expected="mrjoshuap-ezcve-${{ steps.version.outputs.version }}.tar.gz"
          if [[ ! -f "${expected}" ]]; then
            echo "ERROR: expected ${expected}"
            ls -la
            exit 1
          fi

      - name: Publish to Ansible Galaxy
        if: steps.version.outputs.channel != 'skip'
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GALAXY_API_KEY}" ]]; then
            echo "ERROR: Set repository secret GALAXY_API_KEY from Galaxy → Preferences → API token"
            exit 1
          fi
          artifact="mrjoshuap-ezcve-${{ steps.version.outputs.version }}.tar.gz"
          ansible-galaxy collection publish "${artifact}" --token "${GALAXY_API_KEY}"
          echo "Published ${artifact} to galaxy.ansible.com"

      - name: Publish GitHub release
        if: steps.version.outputs.channel != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "${{ steps.version.outputs.channel }}" == "dev" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            "mrjoshuap-ezcve-${{ steps.version.outputs.version }}.tar.gz" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "${flags[@]}"
