---
DOCUMENTATION:
  name: os_id
  version_added: "1.0.0"
  short_description: normalize a distribution to a supported family
  description:
    - Return V(redhat), V(fedora), V(debian), V(ubuntu), or V(unsupported).
    - Ubuntu is matched by distribution name. Other Red Hat family distributions use O(os_family).
  author:
    - mrjoshuap
  notes:
    - This filter runs on the controller.
  positional: _input, os_family
  options:
    _input:
      description: Distribution name, such as V(Rocky) or V(Ubuntu).
      type: str
      required: true
    os_family:
      description: Value of C(ansible_facts['os_family']).
      type: str
      required: true

EXAMPLES: |
  {{ "Ubuntu" | mrjoshuap.ezcve.os_id("Debian") }}
  {{ "Rocky" | mrjoshuap.ezcve.os_id("RedHat") }}

RETURN:
  _value:
    description: Normalized family name.
    type: str
